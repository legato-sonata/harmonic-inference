[package]
name = "audio-processor"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = "0.15"
ndarray-linalg = "0.16"
rustfft = "6.1"
num-complex = "0.4"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
criterion = "0.5"
